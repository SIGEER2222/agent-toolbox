<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>凡人修仙传 · zyfun直连</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#eee;font-family:system-ui}
  #v{width:100%;height:100%;background:#000}
  #tip{position:fixed;top:12px;left:12px;background:rgba(0,0,0,.55);padding:6px 12px;
       border-radius:6px;font-size:14px;z-index:9}
  #play{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        font-size:64px;color:#fff;cursor:pointer;z-index:10}
</style>
</head>
<body>
<div id="tip"></div>
<video id="v" controls muted></video>
<div id="play">▶</div>
<script src="hls.min.js"></script>
<script>
var p = new URLSearchParams(location.search);
var src = p.get('src') || 'https://vv.jisuzyv.com/play/b680rlVe/index.m3u8';
var title = p.get('t') || '凡人修仙传 第195集';
document.getElementById('tip').textContent = title;
document.title = title;
var v = document.getElementById('v');
var overlay = document.getElementById('play');
function start() {
  overlay.style.display = 'none';
  v.muted = false;
  v.play().catch(function(){ v.muted = true; v.play().catch(function(){}); });
}
if (window.Hls && Hls.isSupported()) {
  var h = new Hls({maxBufferLength: 30});
  h.loadSource(src);
  h.attachMedia(v);
  h.on(Hls.Events.ERROR, function(e, d){
    document.getElementById('tip').textContent = title + '  [' + (d.details || 'err') + ']';
  });
  h.on(Hls.Events.MANIFEST_PARSED, function(){ v.play().catch(function(){}); });
} else if (v.canPlayType('application/vnd.apple.mpegurl')) {
  v.src = src; v.play().catch(function(){});
} else {
  document.getElementById('tip').textContent = '此浏览器不支持 HLS';
}
overlay.onclick = start;
v.onclick = function(){ if (overlay.style.display !== 'none') start(); };
</script>
</body>
</html>
